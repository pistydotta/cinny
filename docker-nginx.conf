# Hashed build files never change, so they can be kept for good; everything else (index.html,
# sw.js, config.json) must be checked on every load, or browsers keep serving an old build
# after a deploy.
map $uri $blazeroom_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 80;
  listen [::]:80;

  location / {
    add_header Cache-Control $blazeroom_cache_control always;
    root /usr/share/nginx/html;

    rewrite ^/config.json$ /config.json break;
    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    rewrite ^/public/(.*)$ /public/$1 break;
    rewrite ^/assets/(.*)$ /assets/$1 break;

    rewrite ^(.+)$ /index.html break;
  }
}
